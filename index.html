<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Journey Fixed</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                   display: flex; flex-direction: column; justify-content: center; align-items: center; 
                   z-index: 100; background: #000; transition: opacity 1.5s ease; }
        h1 { color: #fff; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 30px; font-size: 24px; text-align: center; }
        button { padding: 25px 50px; font-size: 20px; background: transparent; border: 2px solid #ff00ff; 
                 color: #ff00ff; cursor: pointer; border-radius: 50px; transition: 0.3s; }
        button:active { background: #ff00ff; color: white; }

        #modal { position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
                 width: 90%; max-width: 400px; padding: 40px 20px; background: rgba(0, 0, 0, 0.95); 
                 border: 2px solid #ff00ff; border-radius: 20px; color: #fff; text-align: center; z-index: 50;
                 transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.5s; }
        #modal.hidden { transform: translate(-50%, 150vh); opacity: 0; }
        
        #close-btn { position: absolute; top: 0px; right: 0px; cursor: pointer; 
                     font-size: 40px; color: #ff00ff; padding: 15px 25px; line-height: 1; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>Cosmic Journey</h1>
    <button onclick="start()">ВЛІТІТИ В СИСТЕМУ</button>
</div>

<div id="modal" class="hidden">
    <div id="close-btn" onclick="closeModal()">&times;</div>
    <h2 id="modal-text" style="margin-top: 10px; font-size: 1.4rem;"></h2>
</div>

<canvas id="c"></canvas>

<script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    let w, h, state = 'WARP', currentSpeed = 20;

    function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    window.onresize = resize; resize();

    let stars = Array.from({length: 300}, () => ({ 
        x: Math.random()*w, y: Math.random()*h, z: Math.random()*w,
        color: Math.random() > 0.9 ? '#ff00ff' : '#fff'
    }));
    let comets = [];

    function start() {
        document.getElementById('overlay').style.opacity = '0';
        setTimeout(() => { document.getElementById('overlay').style.display = 'none'; state = 'SYSTEM'; }, 1000);
    }

    function openModal(text) { modalText.innerText = text; modal.classList.remove('hidden'); }
    function closeModal() { modal.classList.add('hidden'); }

    const planets = [
        { name: "Сонце", wish: "Ілона, ти — центр всесвіту! ✨", color: "#FFD700", dist: 0, size: 30, angle: 0, speed: 0 },
        { name: "Меркурій", wish: "Твій розум — безмежний.", color: "#aaaaaa", dist: 60, size: 6, angle: Math.random()*6, speed: 0.03 },
        { name: "Венера", wish: "Краса, що надихає.", color: "#e6e6fa", dist: 90, size: 9, angle: Math.random()*6, speed: 0.02 },
        { name: "Земля", wish: "Ти робиш світ кращим.", color: "#4a90e2", dist: 120, size: 10, angle: Math.random()*6, speed: 0.015 },
        { name: "Марс", wish: "Твій дух незламний!", color: "#ff6347", dist: 150, size: 8, angle: Math.random()*6, speed: 0.012 },
        { name: "Юпітер", wish: "Твій потенціал величезний!", color: "#d2b48c", dist: 190, size: 16, angle: Math.random()*6, speed: 0.008 },
        { name: "Сатурн", wish: "Ти унікальна у всьому.", color: "#f4a460", dist: 230, size: 14, angle: Math.random()*6, speed: 0.006 }
    ];

    function loop() {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0,0,w,h);

        if (state === 'SYSTEM' && currentSpeed > 0.3) currentSpeed *= 0.95;

        stars.forEach(s => {
            s.z -= currentSpeed;
            if (s.z <= 0) s.z = w;
            let sx = (s.x - w/2) * (w / s.z) + w/2;
            let sy = (s.y - h/2) * (w / s.z) + h/2;
            ctx.fillStyle = s.color;
            ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI*2); ctx.fill();
        });

        if(Math.random() < 0.01) comets.push({x: -50, y: Math.random()*h, vx: 5 + currentSpeed, vy: 2});
        comets.forEach((k, i) => {
            k.x += k.vx; k.y += k.vy;
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.beginPath(); ctx.moveTo(k.x, k.y); ctx.lineTo(k.x-20, k.y-10); ctx.stroke();
            if(k.x > w + 100) comets.splice(i, 1);
        });

        if (state === 'SYSTEM') {
            planets.forEach(p => {
                p.angle += p.speed;
                let x = w/2 + Math.cos(p.angle) * p.dist;
                let y = h/2 + Math.sin(p.angle) * p.dist;
                if(p.dist > 0) { ctx.strokeStyle = "#111"; ctx.beginPath(); ctx.arc(w/2, h/2, p.dist, 0, Math.PI*2); ctx.stroke(); }
                let g = ctx.createRadialGradient(x-p.size/3, y-p.size/3, 1, x, y, p.size);
                g.addColorStop(0, "#fff"); g.addColorStop(1, p.color);
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI*2); ctx.fill();
                p.currX = x; p.currY = y;
            });
        }
        requestAnimationFrame(loop);
    }
    loop();

    function handleInteraction(e) {
        if(state !== 'SYSTEM') return;
        let clientX = e.clientX || e.touches[0].clientX;
        let clientY = e.clientY || e.touches[0].clientY;
        
        // Перевіряємо планети в зворотному порядку (від найдальшої до Сонця),
        // щоб якщо орбіти близько, пріоритет мала та, що ближче до краю екрана.
        for (let i = planets.length - 1; i >= 0; i--) {
            let p = planets[i];
            // Збільшений радіус кліку на 15px для кожної планети
            if(Math.hypot(clientX - p.currX, clientY - p.currY) < p.size + 15) {
                openModal(p.wish);
                return; // Виходимо після першої знайденої планети
            }
        }
    }

    window.addEventListener('click', handleInteraction);
    window.addEventListener('touchstart', handleInteraction);
</script>
</body>
</html>
