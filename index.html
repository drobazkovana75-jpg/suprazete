<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Journey Final</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Екран входу */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                   display: flex; flex-direction: column; justify-content: center; align-items: center; 
                   z-index: 100; background: #000; transition: opacity 1.5s ease; }
        h1 { color: #fff; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 40px; }
        button { padding: 25px 50px; font-size: 20px; background: transparent; border: 2px solid #ff00ff; 
                 color: #ff00ff; cursor: pointer; border-radius: 50px; transition: 0.3s; }
        button:hover { background: #ff00ff; color: white; box-shadow: 0 0 40px #ff00ff; }

        /* Модальне вікно */
        #modal { position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
                 width: 300px; padding: 20px; background: rgba(0, 0, 0, 0.9); border: 1px solid #ff00ff; 
                 border-radius: 15px; color: #fff; text-align: center; z-index: 50;
                 transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s; }
        #modal.hidden { transform: translate(-50%, 150vh); opacity: 0; }
        #close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; color: #ff00ff; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>System Initialization</h1>
    <button onclick="start()">ВЛІТІТИ В СИСТЕМУ</button>
</div>

<div id="modal" class="hidden">
    <span id="close-btn" onclick="closeModal()">&times;</span>
    <h2 id="modal-text"></h2>
</div>

<canvas id="c"></canvas>

<script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    let w, h, state = 'WARP', currentSpeed = 20;

    function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
    window.onresize = resize; resize();

    // Постійні зірки
    let stars = Array.from({length: 500}, () => ({ 
        x: Math.random()*w, y: Math.random()*h, z: Math.random()*w,
        color: Math.random() > 0.9 ? '#ff00ff' : '#fff'
    }));
    let comets = [];

    function start() {
        document.getElementById('overlay').style.opacity = '0';
        setTimeout(() => { document.getElementById('overlay').style.display = 'none'; state = 'SYSTEM'; }, 1000);
    }

    function openModal(text) { modalText.innerText = text; modal.classList.remove('hidden'); }
    function closeModal() { modal.classList.add('hidden'); }

    const planets = [
        { name: "Сонце", wish: "Ілона, ти — центр всесвіту! ✨", color: "#FFD700", dist: 0, size: 40, angle: 0, speed: 0 },
        { name: "Меркурій", wish: "Твій розум — безмежний.", color: "#aaaaaa", dist: 80, size: 7, angle: Math.random()*6, speed: 0.03 },
        { name: "Венера", wish: "Краса, що надихає.", color: "#e6e6fa", dist: 120, size: 10, angle: Math.random()*6, speed: 0.02 },
        { name: "Земля", wish: "Ти робиш світ кращим.", color: "#4a90e2", dist: 160, size: 12, angle: Math.random()*6, speed: 0.015 },
        { name: "Марс", wish: "Твій дух незламний!", color: "#ff6347", dist: 200, size: 9, angle: Math.random()*6, speed: 0.012 },
        { name: "Юпітер", wish: "Твій потенціал величезний!", color: "#d2b48c", dist: 260, size: 20, angle: Math.random()*6, speed: 0.008 },
        { name: "Сатурн", wish: "Ти унікальна у всьому.", color: "#f4a460", dist: 320, size: 16, angle: Math.random()*6, speed: 0.006 },
        { name: "Уран", wish: "Мрій сміливо!", color: "#afeeee", dist: 380, size: 11, angle: Math.random()*6, speed: 0.005 },
        { name: "Нептун", wish: "Твої мрії прекрасні.", color: "#4169e1", dist: 440, size: 11, angle: Math.random()*6, speed: 0.004 }
    ];

    function loop() {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0,0,w,h);

        // Плавне сповільнення швидкості
        if (state === 'SYSTEM') {
            if (currentSpeed > 0.3) currentSpeed *= 0.95;
        }

        // Малювання зірок
        stars.forEach(s => {
            s.z -= currentSpeed;
            if (s.z <= 0) s.z = w;
            let sx = (s.x - w/2) * (w / s.z) + w/2;
            let sy = (s.y - h/2) * (w / s.z) + h/2;
            ctx.fillStyle = s.color;
            ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
        });

        // Малювання комет (завжди)
        if(Math.random() < 0.01) comets.push({x: -50, y: Math.random()*h, vx: 5 + currentSpeed, vy: 2});
        comets.forEach((k, i) => {
            k.x += k.vx; k.y += k.vy;
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.moveTo(k.x, k.y); ctx.lineTo(k.x-30, k.y-15); ctx.stroke();
            if(k.x > w + 100) comets.splice(i, 1);
        });

        // Малювання планет (тільки в системі)
        if (state === 'SYSTEM') {
            planets.forEach(p => {
                p.angle += p.speed;
                let x = w/2 + Math.cos(p.angle) * p.dist;
                let y = h/2 + Math.sin(p.angle) * p.dist;
                
                if(p.dist > 0) { ctx.strokeStyle = "#222"; ctx.beginPath(); ctx.arc(w/2, h/2, p.dist, 0, Math.PI*2); ctx.stroke(); }
                
                let g = ctx.createRadialGradient(x-p.size/3, y-p.size/3, 2, x, y, p.size);
                g.addColorStop(0, "#fff"); g.addColorStop(1, p.color);
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI*2); ctx.fill();
                p.currX = x; p.currY = y;
            });
        }
        requestAnimationFrame(loop);
    }
    loop();

    window.onclick = (e) => {
        if(state !== 'SYSTEM') return;
        planets.forEach(p => {
            if(Math.hypot(e.clientX - p.currX, e.clientY - p.currY) < p.size + 15) openModal(p.wish);
        });
    }
</script>
</body>
</html>
